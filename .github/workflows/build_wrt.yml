name: Build WRT
run-name: Build - ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: jdcloud_ipq60xx_libwrt
        options:
          - jdcloud_ipq60xx_immwrt
          - jdcloud_ipq60xx_libwrt

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Free disk space
        uses: sbwml/actions@free-disk

      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Build Date and Timezone
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Pre Clone
        run: ./pre_clone_action.sh ${{ inputs.model }}

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-

      - name: 测试缓存命中情况
        run: |
          full_key="${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}"
          restore_key_prefix="${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-"
      
          echo "完整缓存 Key: $full_key"
          echo "restore-keys 前缀: $restore_key_prefix"
      
          echo "查询完全匹配的缓存 Key："
          gh cache list --key "$full_key" --json key --jq '.[] | .key' || echo "无完全匹配缓存"
      
          if gh cache list --key "$full_key" --json key --jq '.[] | .key' | grep -q .; then
            echo "找到完全匹配的缓存。"
          else
            echo "没有找到完全匹配的缓存。"
          fi
      
          echo "---------------------------------"
      
          echo "查询 restore-keys 匹配的缓存 Key 列表："
          gh cache list --key "$restore_key_prefix" --json key --jq '.[] | .key' || echo "无 restore-keys 缓存"
      
          if gh cache list --key "$restore_key_prefix" --json key --jq '.[] | .key' | grep -q .; then
            echo "找到 restore-keys 匹配的缓存。"
          else
            echo "没有找到 restore-keys 匹配的缓存。"
          fi

      - name: 检查缓存目录大小1
        run: |
          echo ".ccache 目录大小："
          du -sh ./action_build/.ccache || echo "未找到 .ccache"
          echo "staging_dir 目录大小："
          du -sh ./action_build/staging_dir || echo "未找到 staging_dir"

      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: 检查缓存目录大小2
        run: |
          echo ".ccache 目录大小："
          du -sh ./action_build/.ccache || echo "未找到 .ccache"
          echo "staging_dir 目录大小："
          du -sh ./action_build/staging_dir || echo "未找到 staging_dir"


      - name: Build Firmware
        run: ./build.sh ${{ inputs.model }}

      - name: Delete Old Cache
        run: |
          # 获取缓存列表并删除
          gh cache list --key ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          # 输出缓存状态
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache | cut -f 1)"
          echo "staging: $(du -sh ./action_build/staging_dir | cut -f 1)"

      - name: Machine Information
        run: |
          echo "=============================================="
          lscpu | grep -E "name|Core|Thread"
          echo "=============================================="
          df -h
          echo "=============================================="

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_DATE }}_${{ inputs.model }}
          path: ./firmware/*.*
